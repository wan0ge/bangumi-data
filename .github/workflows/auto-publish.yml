name: Auto Publish to npm

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      id-token: write  # Trusted Publishing 要求：允许 GitHub 生成短期 OIDC 凭证

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Trusted Publishing 要求 npm >= 11.5.1，确保使用最新版本
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Build
        run: npm run build

      # 获取上游 bangumi-data 最新版本号，用于决定版本号策略：
      # 我们领先或平齐上游 → patch 递增（如 0.3.214 → 0.3.215）
      # 上游领先我们 → 对齐上游+1（如 0.3.214 → 0.3.215）
      - name: Get upstream latest version
        id: upstream
        run: |
          UP_VER=$(curl -s -m 10 "https://api.github.com/repos/bangumi-data/bangumi-data/tags?per_page=1" | node -e "
            let d=[];
            try { d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8').trim()||'[]'); } catch(e){}
            if(d[0] && d[0].name) console.log(d[0].name.replace(/^v/,''));
          " 2>/dev/null || echo "")
          if [ -z "$UP_VER" ]; then
            UP_VER=$(git ls-remote --tags https://github.com/bangumi-data/bangumi-data.git 2>/dev/null \
              | grep -v '\^{}' | awk '{print $2}' \
              | sed 's|refs/tags/v||' | sort -V | tail -1)
          fi
          echo "version=$UP_VER" >> $GITHUB_OUTPUT
          echo "::notice::上游最新版本: ${UP_VER:-未知}"

      - name: Check if version changed
        id: version
        run: |
          CURRENT=$(node -e "console.log(require('./package.json').version)")
          PREVIOUS=$(git show HEAD~1:package.json 2>/dev/null | node -e "
            const fs=require('fs');
            let d='';
            try { d=fs.readFileSync(0,'utf8'); } catch(e) {}
            try { console.log(JSON.parse(d).version); } catch(e) { console.log(''); }
          " || echo "")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "::notice::版本已变更: $PREVIOUS → $CURRENT"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "::notice::版本未变，将自动计算下一版本"
          fi

      # 手动 bump 路径：检查 package.json 中的版本号是否已发布到 npm
      # 已发布时回退到自动 bump 路径，根据上游版本重新计算
      - name: Check if version already published
        if: steps.version.outputs.changed == 'true'
        id: npm-check
        run: |
          PKG_NAME=$(node -e "console.log(require('./package.json').name)")
          PKG_VERSION="${{ steps.version.outputs.current }}"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version --json >/dev/null 2>&1; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "::notice::版本 ${PKG_NAME}@${PKG_VERSION} 已存在于 npm，回退到自动计算"
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
            echo "::notice::版本 ${PKG_NAME}@${PKG_VERSION} 不存在于 npm，将直接发布"
          fi

      # 手动 bump 路径：package.json 版本号已由推送方设置且未发布，直接发布
      - name: Publish (manual bump)
        if: steps.version.outputs.changed == 'true' && steps.npm-check.outputs.already_published == 'false'
        run: npm publish --access public --provenance --tag latest

      - name: Create GitHub Release (manual bump)
        if: steps.version.outputs.changed == 'true' && steps.npm-check.outputs.already_published == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.current }}
          name: v${{ steps.version.outputs.current }}
          body: ""
          draft: false
          prerelease: false

      # 自动 bump 路径（版本未变，或手动 bump 的版本已发布时回退到此路径）：
      # 根据当前版本与上游版本的关系计算下一版本号
      #
      # 版本号策略（与 auto-sync.sh 的 calc_next_version 保持一致）：
      #   含 -test. 后缀 → 跳过（测试版本不触发自动发布）
      #   我们领先或平齐上游（cur >= up）→ patch 递增
      #     示例：cur=0.3.214-1, up=0.3.213 → 0.3.215
      #           cur=0.3.214,   up=0.3.213 → 0.3.215
      #   上游领先我们（cur < up）→ 对齐上游+1
      #     示例：cur=0.3.214,   up=0.3.216 → 0.3.217
      - name: Auto bump and publish
        if: steps.version.outputs.changed == 'false' || (steps.version.outputs.changed == 'true' && steps.npm-check.outputs.already_published == 'true')
        id: auto-bump
        run: |
          CURRENT="${{ steps.version.outputs.current }}"
          UP_VER="${{ steps.upstream.outputs.version }}"

          # 测试版本（含 -test.）不触发自动发布
          if echo "$CURRENT" | grep -q '\-test\.'; then
            echo "::notice::检测到测试版本 $CURRENT，跳过发布"
            echo "skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          NEXT=$(CUR_VER="$CURRENT" UP_VER="$UP_VER" node -e "
            const cur_raw = process.env.CUR_VER;
            const up_str  = process.env.UP_VER;

            function parseVer(s) {
              const m = String(s || '').match(/^(\d+)\.(\d+)\.(\d+)/);
              if (!m) return [0, 3, 200];
              return [Number(m[1]), Number(m[2]), Number(m[3])];
            }
            function cmp(a, b) {
              for (let i = 0; i < 3; i++) {
                if (a[i] > b[i]) return  1;
                if (a[i] < b[i]) return -1;
              }
              return 0;
            }

            const cur = parseVer(cur_raw);
            const up  = parseVer(up_str);

            let next;
            if (cmp(cur, up) >= 0) {
              // 我们领先或平齐上游：在当前基础上 patch+1
              next = [cur[0], cur[1], cur[2] + 1];
            } else {
              // 上游领先我们：对齐上游+1
              next = [up[0], up[1], up[2] + 1];
            }
            console.log(next.join('.'));
          " 2>/dev/null || echo "")

          if [ -z "$NEXT" ]; then
            echo "::notice::版本计算失败，跳过发布"
            echo "skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "next=$NEXT" >> $GITHUB_OUTPUT
          echo "skipped=false" >> $GITHUB_OUTPUT
          echo "::notice::自动计算版本: $CURRENT → $NEXT (上游: ${UP_VER:-未知})"

          npm pkg set version="$NEXT"
          npm publish --access public --provenance --tag latest

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: auto release $NEXT"
          git tag "v$NEXT"
          git push origin master --tags

      - name: Create GitHub Release (auto bump)
        if: (steps.version.outputs.changed == 'false' || (steps.version.outputs.changed == 'true' && steps.npm-check.outputs.already_published == 'true')) && steps.auto-bump.outputs.skipped == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.auto-bump.outputs.next }}
          name: v${{ steps.auto-bump.outputs.next }}
          body: ""
          draft: false
          prerelease: false

      # 发布后清除 jsDelivr CDN 缓存
      # jsDelivr 对版本范围 URL（如 @0.3）缓存最长 7 天，不清除则用户拿不到新版本
      # 等待 120 秒让 npm 传播新版本，否则 jsDelivr 可能重新缓存旧版本
      - name: Purge jsDelivr cache
        if: |
          (steps.version.outputs.changed == 'true' && steps.npm-check.outputs.already_published == 'false') ||
          steps.auto-bump.outputs.skipped == 'false'
        run: |
          echo "::notice::发布完成，等待 120 秒让 npm 传播新版本..."
          sleep 120
          echo "::notice::清除 jsDelivr CDN 缓存..."
          RESPONSE=$(curl -s -m 30 "https://purge.jsdelivr.net/npm/@wan0ge/bangumi-data@0.3/dist/data.json")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | node -e "
            let d='';
            process.stdin.on('data', c => d += c);
            process.stdin.on('end', () => {
              try {
                const j = JSON.parse(d);
                console.log(j.status || 'unknown');
              } catch(e) {
                console.log('error');
              }
            });
          ")
          if [ "$STATUS" = "finished" ]; then
            echo "::notice::jsDelivr 缓存清除成功"
          else
            echo "::warning::jsDelivr 缓存清除可能失败，状态: $STATUS"
          fi
